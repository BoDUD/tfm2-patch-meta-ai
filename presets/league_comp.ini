; League of Legends champion knowledge table for the draft (ban/pick) advisor.
; One line per champion of the "league" mod (same ids and order as league_positions.ini).
; Ratings describe the kit as played in professional play in its main role, not edge cases.
; 英雄联盟英雄资料表，供 BP 助手判断阵容（前排/开团/保护/AP-AD 平衡/消耗/突进）和英雄强度。按职业赛场主位置的常规玩法评分。
;
; Fields (all required, in this order) / 字段说明:
;   dmg     AD | AP | MIX  main damage type (MIX = genuinely hybrid or mostly true damage)
;                          主要伤害类型：物理 AD / 魔法 AP / 混合或真伤 MIX
;   front   0-2  frontline: 2 = real tank, 1 = durable bruiser/juggernaut, 0 = squishy
;                前排：2 坦克，1 战士/重装，0 脆皮
;   engage  0-2  starting fights: 2 = reliable hard engage, 1 = some engage/catch, 0 = none
;                开团：2 稳定硬开，1 有一定开团/抓人能力，0 没有
;   peel    0-2  protecting own carries (2 = Janna, Lulu, Braum, Taric)
;                保护己方核心
;   poke    0-2  long-range siege/poke (2 = Xerath, Jayce, Ezreal, Varus, Zoe)
;                远程消耗/拆塔
;   dive    0-2  reaching and killing the enemy backline (2 = Zed, Camille, Kha'Zix, Vi, Diana)
;                突进切后排
;   carry   0-2  scaling damage threat that wins late fights and wants protection (2 = Jinx, Kog'Maw, Aphelios, Kassadin, Azir)
;                后期核心输出（需要保护）
;   cc      0-2  total crowd control in the kit
;                控制总量
;   tier    S/A/B/C/D  pro-play priority/strength in the 2025-2026 meta (about S 10%, A 20%, B 40%, C 20%, D 10%)
;                职业赛场优先级/强度（2025-2026 版本）
; 2 is reserved for the clear archetype examples of each field. / 每项 2 分只给典型代表。

